<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-label="What you can do">
<text x="0" y="26" font-size="18" font-weight="400" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">What you can do</text>
<rect x="0.5" y="48.5" width="303.0" height="151" rx="12" fill="#ffffff" stroke="#b3b3b3"/>
<svg x="20.0" y="68" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="5"/><path d="M3 27 C3 21 7 18 11 18 C15 18 19 21 19 27"/><path d="M21 7 C24 7 26 9 26 12 C26 15 24 17 21 17 M23 19 C27 20 29 23 29 27"/></g></svg>
<text x="20.0" y="132" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Many accounts at once</text>
<text x="20.0" y="158" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Connect as many TikTok, Kwai and</text>
<text x="20.0" y="180" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Likee accounts as you want.</text>
<rect x="328.5" y="48.5" width="303.0" height="151" rx="12" fill="#ffffff" stroke="#b3b3b3"/>
<svg x="348.0" y="68" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 H21 V17 H11 L6 22 V17 H3 Z"/><path d="M25 11 H29 V23 H26 V28 L21 23 H13"/></g></svg>
<text x="348.0" y="132" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">One chat for everything</text>
<text x="348.0" y="158" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Comments arrive in one place, with</text>
<text x="348.0" y="180" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">spam and abuse filtered out.</text>
<rect x="656.5" y="48.5" width="303.0" height="151" rx="12" fill="#ffffff" stroke="#b3b3b3"/>
<svg x="676.0" y="68" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="3" width="10" height="7" rx="2"/><path d="M16 10 V16 M6 22 V16 H26 V22"/><rect x="2" y="22" width="8" height="7" rx="2"/><rect x="22" y="22" width="8" height="7" rx="2"/></g></svg>
<text x="676.0" y="132" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Stream to several places</text>
<text x="676.0" y="158" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">One show to all your accounts.</text>
<text x="676.0" y="180" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">If one fails, the others carry on.</text>
<rect x="0.5" y="224.5" width="303.0" height="151" rx="12" fill="#ffffff" stroke="#b3b3b3"/>
<svg x="20.0" y="244" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="13"/><circle cx="10" cy="13" r="1.4"/><circle cx="16" cy="9" r="1.4"/><circle cx="22" cy="13" r="1.4"/><path d="M16 29 C12 25 18 21 22 22"/></g></svg>
<text x="20.0" y="308" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Make it yours</text>
<text x="20.0" y="334" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Change colours, fonts and</text>
<text x="20.0" y="356" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">backgrounds, and see it instantly.</text>
<rect x="328.5" y="224.5" width="303.0" height="151" rx="12" fill="#ffffff" stroke="#b3b3b3"/>
<svg x="348.0" y="244" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 H27 M5 16 H27 M5 23 H27"/><circle cx="11" cy="9" r="2.6"/><circle cx="21" cy="16" r="2.6"/><circle cx="13" cy="23" r="2.6"/></g></svg>
<text x="348.0" y="308" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Stay in control</text>
<text x="348.0" y="334" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Skip a question, pass the floor,</text>
<text x="348.0" y="356" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">or stop everything with one button.</text>
<rect x="656.5" y="224.5" width="303.0" height="151" rx="12" fill="#ffffff" stroke="#b3b3b3"/>
<svg x="676.0" y="244" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="14" width="20" height="14" rx="3"/><path d="M10 14 V10 C10 6 13 3.5 16 3.5 C19 3.5 22 6 22 10 V14"/></g></svg>
<text x="676.0" y="308" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Your password stays yours</text>
<text x="676.0" y="334" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">You sign in on each platform's own</text>
<text x="676.0" y="356" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">page. Sign-ins are stored encrypted.</text>
<text x="0" y="416" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Press Ctrl K (⌘ K on Mac) to find anything.</text>
</svg>
