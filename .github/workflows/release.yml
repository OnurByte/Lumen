name: Release
# Pushing a tag such as v0.1.0 builds the archives install.sh downloads, with SHA-256 files,
# and attaches them to a GitHub release. Archives are not code-signed or notarised yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
      - name: Pack archive
        shell: bash
        run: packaging/release-archive.sh
      - name: Smoke-test the packed CLI
        shell: bash
        run: |
          mkdir smoke
          if [[ -f dist/lumen-windows-x86_64.zip ]]; then
            7z x -osmoke dist/lumen-windows-x86_64.zip >/dev/null
            smoke/lumen/lumen-live.exe --version
          else
            tar -xzf dist/lumen-*.tar.gz -C smoke
            smoke/lumen/lumen-live --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.runner }}
          path: dist/
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Lumen $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
