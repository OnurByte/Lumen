[package]
name = "lumen-studio"
version = "0.1.1"
edition.workspace = true
[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
# shortcut: GPUI's xattr 0.2 uses removed ENOATTR, remove pin when GPUI updates its archive helper.
libc = "=0.2.186"
lumen-protocol = { path = "../../crates/lumen-protocol" }
serde = { version = "1", features = ["derive"] }
toml = "1"
lumen-obs = { path = "../../crates/lumen-obs" }
lumen-accounts = { path = "../../crates/lumen-accounts" }
lumen-live = { path = "../../crates/lumen-live" }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
