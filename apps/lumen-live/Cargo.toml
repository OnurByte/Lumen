[package]
name = "lumen-live-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lumen-live"
path = "src/main.rs"

[dependencies]
lumen-live = { path = "../../crates/lumen-live" }
lumen-accounts = { path = "../../crates/lumen-accounts" }
lumen-broadcast = { path = "../../crates/lumen-broadcast" }
lumen-platform-tiktok = { path = "../../crates/lumen-platform-tiktok" }
lumen-platform-kwai = { path = "../../crates/lumen-platform-kwai" }
lumen-platform-likee = { path = "../../crates/lumen-platform-likee" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
reqwest.workspace = true
tracing-subscriber.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
