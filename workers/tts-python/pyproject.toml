[project]
name = "lumen-tts-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pocket-tts-turkish==0.1.0", "torch>=2.5,<3", "torchaudio>=2.5,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
